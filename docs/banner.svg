<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132449"/>
      <stop offset="1" stop-color="#2c1f5e"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="0.45" stop-color="#ffa94d"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7d6bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7d6bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#sky)"/>
  <circle cx="830" cy="390" r="260" fill="url(#glow)"/>
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="2" opacity="0.7"/><circle cx="150" cy="190" r="1.5" opacity="0.5"/>
    <circle cx="1180" cy="70" r="2" opacity="0.7"/><circle cx="1100" cy="190" r="1.5" opacity="0.5"/>
    <circle cx="460" cy="210" r="1.5" opacity="0.5"/><circle cx="1230" cy="300" r="2" opacity="0.6"/>
    <circle cx="40" cy="300" r="1.5" opacity="0.5"/><circle cx="700" cy="560" r="1.5" opacity="0.4"/>
    <circle cx="300" cy="610" r="2" opacity="0.5"/><circle cx="1010" cy="600" r="1.5" opacity="0.5"/>
  </g>

  <!-- title -->
  <text x="640" y="92" text-anchor="middle" font-size="60" font-weight="700" fill="#ffffff">AI Test Designer</text>
  <text x="640" y="140" text-anchor="middle" font-size="24" fill="#c9d4ee">A friendly dragon drafts test cases from requirements. Quality gates keep it honest.</text>

  <!-- ground shadow -->
  <ellipse cx="240" cy="540" rx="170" ry="18" fill="#000000" opacity="0.25"/>

  <!-- ===== dragon ===== -->
  <!-- tail -->
  <path d="M150 470 C 70 500, 40 430, 85 400 C 110 385, 135 400, 125 420" fill="none" stroke="#3fb68b" stroke-width="26" stroke-linecap="round"/>
  <path d="M125 420 L 100 440 L 140 445 Z" fill="#2e8f6c"/>
  <path d="M113 405 L 128 384 L 138 410 Z" fill="#f6d58e"/>
  <!-- wing -->
  <path d="M210 375 C 165 255, 95 255, 60 290 C 100 300, 110 320, 118 345 C 140 325, 162 335, 168 360 C 182 345, 200 352, 210 375 Z" fill="#2e8f6c"/>
  <path d="M210 375 C 175 300, 130 285, 95 292" fill="none" stroke="#25775a" stroke-width="4"/>
  <!-- back spikes -->
  <path d="M150 380 L 160 350 L 178 372 Z M 185 357 L 200 326 L 215 352 Z M 222 348 L 240 318 L 252 347 Z" fill="#f6d58e"/>
  <!-- body -->
  <ellipse cx="235" cy="440" rx="112" ry="88" fill="#3fb68b"/>
  <ellipse cx="262" cy="458" rx="62" ry="62" fill="#f6d58e"/>
  <path d="M215 430 Q 262 442 310 430 M 208 458 Q 262 472 316 458 M 215 486 Q 262 498 310 486" fill="none" stroke="#e3b866" stroke-width="4" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="185" cy="522" rx="34" ry="16" fill="#2e8f6c"/>
  <ellipse cx="295" cy="524" rx="34" ry="16" fill="#2e8f6c"/>
  <path d="M160 520 l 6 8 M 175 524 l 4 8 M 270 522 l 6 8 M 285 526 l 4 8" stroke="#f6d58e" stroke-width="4" stroke-linecap="round"/>
  <!-- arm holding a clipboard -->
  <g transform="translate(322 448) rotate(14)">
    <rect x="-6" y="-38" width="56" height="70" rx="6" fill="#e9eef8"/>
    <rect x="12" y="-44" width="20" height="10" rx="3" fill="#8a97b3"/>
    <path d="M4 -18 l 6 6 l 10 -12 M 4 2 l 6 6 l 10 -12" fill="none" stroke="#34c27a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 -14 h 16 M 26 6 h 16 M 4 22 h 38" stroke="#8a97b3" stroke-width="3" stroke-linecap="round"/>
  </g>
  <ellipse cx="318" cy="472" rx="20" ry="13" fill="#3fb68b" transform="rotate(-25 318 472)"/>
  <!-- neck + head -->
  <path d="M260 380 C 270 340, 290 330, 310 330 L 330 360 C 310 370, 300 390, 300 410 Z" fill="#3fb68b"/>
  <path d="M286 236 L 268 188 L 308 228 Z" fill="#f6d58e"/>
  <path d="M330 232 L 334 182 L 358 232 Z" fill="#f6d58e"/>
  <circle cx="318" cy="296" r="70" fill="#3fb68b"/>
  <ellipse cx="380" cy="320" rx="52" ry="38" fill="#4cc79a"/>
  <circle cx="404" cy="306" r="4.5" fill="#25775a"/>
  <circle cx="420" cy="314" r="4.5" fill="#25775a"/>
  <!-- open mouth -->
  <path d="M398 340 Q 420 352 434 330 Q 420 362 392 352 Z" fill="#7a2338"/>
  <path d="M352 336 Q 372 352 398 340" fill="none" stroke="#25775a" stroke-width="4" stroke-linecap="round"/>
  <!-- cheek -->
  <ellipse cx="330" cy="330" rx="15" ry="9" fill="#ff8fa3" opacity="0.6"/>
  <!-- eye + QA glasses -->
  <circle cx="330" cy="284" r="20" fill="#ffffff"/>
  <circle cx="337" cy="287" r="10" fill="#1b1b2f"/>
  <circle cx="341" cy="282" r="3.5" fill="#ffffff"/>
  <circle cx="330" cy="284" r="28" fill="none" stroke="#f6d58e" stroke-width="5"/>
  <path d="M302 280 L 262 270" stroke="#f6d58e" stroke-width="5" stroke-linecap="round"/>
  <path d="M306 254 Q 326 244 350 254" fill="none" stroke="#25775a" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== magic fire ===== -->
  <path d="M430 330 C 500 280, 620 282, 724 338 C 620 394, 500 392, 430 344 Z" fill="url(#flame)"/>
  <path d="M432 334 C 500 312, 570 312, 640 326 C 572 346, 500 350, 432 340 Z" fill="url(#flameCore)" opacity="0.9"/>
  <g fill="#fff6d6">
    <path d="M560 290 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 Z"/>
    <path d="M690 360 l 3 7 l 7 3 l -7 3 l -3 7 l -3 -7 l -7 -3 l 7 -3 Z"/>
    <path d="M610 392 l 3 7 l 7 3 l -7 3 l -3 7 l -3 -7 l -7 -3 l 7 -3 Z"/>
  </g>
  <!-- requirement papers flying through the fire -->
  <g transform="translate(486 300) rotate(-14)">
    <rect width="74" height="54" rx="6" fill="#fdfdfd"/>
    <text x="10" y="22" font-size="15" font-weight="700" fill="#2e5c8a">REQ</text>
    <path d="M10 32 h 52 M 10 42 h 38" stroke="#b8c3d8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(596 334) rotate(11)">
    <rect width="74" height="54" rx="6" fill="#fdfdfd"/>
    <text x="10" y="22" font-size="15" font-weight="700" fill="#2e5c8a">REQ</text>
    <path d="M10 32 h 52 M 10 42 h 30" stroke="#b8c3d8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== quality gate ===== -->
  <text x="808" y="226" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#9fb3d9">QUALITY GATE</text>
  <path d="M752 528 L 752 318 A 56 56 0 0 1 864 318 L 864 528" fill="none" stroke="#9fb3d9" stroke-width="16" stroke-linecap="round"/>
  <path d="M730 528 h 156" stroke="#9fb3d9" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <circle cx="808" cy="276" r="26" fill="#34c27a"/>
  <path d="M795 277 l 9 9 l 17 -19" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- dotted path through the gate -->
  <path d="M712 340 C 760 360, 780 380, 808 400 C 840 420, 880 400, 920 380" fill="none" stroke="#ffe08a" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.8"/>

  <!-- ===== passing test cases ===== -->
  <g font-size="21">
    <g transform="translate(930 262)">
      <rect width="300" height="72" rx="14" fill="#ffffff"/>
      <circle cx="38" cy="36" r="18" fill="#34c27a"/>
      <path d="M29 37 l 6 6 l 12 -13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="31" font-weight="700" fill="#1f3864">TC-001</text>
      <text x="68" y="55" font-size="16" fill="#5b6b88">Valid login</text>
      <rect x="226" y="24" width="60" height="26" rx="13" fill="#e3f7ec"/>
      <text x="256" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#1f9d5b">PASS</text>
    </g>
    <g transform="translate(930 352)">
      <rect width="300" height="72" rx="14" fill="#ffffff"/>
      <circle cx="38" cy="36" r="18" fill="#34c27a"/>
      <path d="M29 37 l 6 6 l 12 -13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="31" font-weight="700" fill="#1f3864">TC-002</text>
      <text x="68" y="55" font-size="16" fill="#5b6b88">Locked-out user</text>
      <rect x="226" y="24" width="60" height="26" rx="13" fill="#e3f7ec"/>
      <text x="256" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#1f9d5b">PASS</text>
    </g>
    <g transform="translate(930 442)">
      <rect width="300" height="72" rx="14" fill="#ffffff"/>
      <circle cx="38" cy="36" r="18" fill="#34c27a"/>
      <path d="M29 37 l 6 6 l 12 -13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="31" font-weight="700" fill="#1f3864">TC-003</text>
      <text x="68" y="55" font-size="16" fill="#5b6b88">Checkout totals</text>
      <rect x="226" y="24" width="60" height="26" rx="13" fill="#e3f7ec"/>
      <text x="256" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#1f9d5b">PASS</text>
    </g>
  </g>

  <!-- footer -->
  <text x="640" y="606" text-anchor="middle" font-size="18" fill="#8fa3c8">requirements  →  Claude  →  quality gates  →  test cases you can trust</text>
</svg>

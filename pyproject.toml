[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-designer"
version = "0.1.0"
description = "Generate manual test cases from requirements with Claude, then check them with quality gates."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tülay Güçlü" }]
dependencies = [
    "anthropic>=2.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-dragon"
version = "0.2.0"
description = "Claude writes test scenarios from requirements; a static review checks them before you use them."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tülay Güçlü" }]
dependencies = [
    "anthropic>=2.4",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
